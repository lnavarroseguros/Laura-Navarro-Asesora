    <style>
        /* --- RESET Y ESTILOS GLOBALES --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f5f7fa;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        /* --- Splash Screen --- */
        #splash {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }

        #splash img {
            width: 280px;
            animation: zoom 1.7s ease-in-out forwards;
        }

        @keyframes zoom {
            0% { transform: scale(0.4); opacity: 0; }
            50% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 0; visibility: hidden; }
        }

        /* --- CONTENEDOR PRINCIPAL --- */
        .container {
            width: 100%;
            max-width: 450px;
            background-color: white;
            position: relative;
            padding-bottom: 90px;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* --- CABECERA DINÁMICA CON ANIMACIÓN --- */
        .header-cover {
            height: 220px;
            background-size: cover;
            background-position: center;
            /* CAMBIO CLAVE: Transición suave de 1.2s para el cambio de imagen */
            transition: background-image 1.2s ease-in-out; 
            padding: 15px;
            position: relative;
            display: flex;
            justify-content: center;
        }

        .top-logo img {
            height: 40px;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3)); /* Sombra para legibilidad */
        }

        /* --- SECCIÓN DE PERFIL --- */
        /* --- SECCIÓN DE PERFIL (Actualizado para eliminar huecos) --- */
.profile-section {
    text-align: center;
    margin-top: -65px; /* Mantenemos el ajuste sobre la portada */
    padding: 0 20px;
    z-index: 2;
}

/* 1. El Contenedor Circular: El "marco" */
.profile-img-container {
    width: 135px; /* Tu tamaño original */
    height: 135px;
    margin: 0 auto;
    border-radius: 50%;
    border: 4px solid #0067b1; /* El borde azul */
    background: white;
    overflow: hidden; /* ¡VITAL! Corta el exceso de imagen para mantener el círculo */
    box-shadow: 0 3px 8px rgba(0,0,0,0.1); /* Sombra suave */
    
    /* Centrado perfecto adentro */
    display: flex;
    align-items: center;
    justify-content: center;
}

/* 2. La Imagen: Lo que va ADENTRO (Aquí está la corrección) */
.profile-img-container img {
    /* ESTOS CAMBIOS ELIMINAN EL HUECO */
    width: 100%;  /* Obliga a la imagen a ocupar todo el ancho del círculo */
    height: 100%; /* Obliga a la imagen a ocupar todo el alto del círculo */
    object-fit: cover; /* ¡EL CAMBIO MÁGICO! Escala la imagen para llenar el círculo sin deformarla */
    
    /* Ajuste de posición: 'center' suele funcionar, pero 'top' centrará mejor el rostro si la foto original tiene aire arriba */
    object-position: top center; 
}

        /* Estadísticas organizadas DEBAJO de la foto */
        .stats-below {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin: 15px 0;
        }

        .stat-box {
            font-size: 14px;
            color: #444;
            line-height: 1.3;
        }

        .name {
            font-size: 22px;
            font-weight: 700;
            color: #2c3e50;
        }

        .role {
            font-size: 15px;
            color: #7f8c8d;
            margin-bottom: 20px;
        }

        /* --- BOTONES Y REDES --- */
        .action-row {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 25px;
        }

        .action-button {
            padding: 10px 22px;
            background-color: #0067b1;
            color: white;
            border: none;
            border-radius: 25px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .action-button:hover {
            background-color: #1c8bd4;
        }
        .social-bar {
            display: flex;
            justify-content: center;
            gap: 15px;
            font-size: 36px;
            margin-bottom: 10px;
        }

        .social-bar a { color: #0067b1; text-decoration: none; transition: color 0.2s; }
        .social-bar a:hover { color: #0b80ce; }

        /* --- Sección de Aseguradoras --- */
/* 1. El contenedor principal limita el ancho visual */
.aseguradoras-section {
  background-color: #ffffff;
  padding: 10px 0; /* Quitamos padding lateral para que el slider llegue a las orillas si es necesario */
  text-align: center;
  width: 100%;
  overflow: hidden; /* Corta los logos que salen del cuadro */
}

/* 2. El "marco" por donde pasan los logos */
.slider-client {
  width: 90%; /* O el porcentaje de ancho que quieras que ocupe en tu pantalla */
  max-width: 1200px; /* Ancho máximo de tu diseño */
  margin: 0 auto;
  overflow: hidden;
  position: relative;
}

/* 3. La tira de logos */
.slider {
  display: flex;
  width: max-content; /* IMPORTANTE: Mantiene a los logos en una sola fila larga */
  gap: 30px; /* Espacio entre logos, ajusta a tu gusto */
  animation: scroll 20s infinite linear;
}

.slider img {
  width: 170px; /* Tamaño de los logos */
  height: 80px;  /* Altura fija para que todos se vean alineados */
  object-fit: contain;
  flex-shrink: 0; /* Evita que los logos se hagan chiquitos para caber */
  transition: filter 0.3s, transform 0.3s;
}

.slider img:hover {
  transform: scale(1.1);
}

/* 4. Animación Infinita Perfecta */
@keyframes scroll {
  0% {
    transform: translateX(0);
  }
  100% {
    /* Cálculo: (Ancho logo 150px + Gap 60px) * 14 logos = 2940px */
    transform: translateX(-2940px);
  }
}

/* --- Ajuste opcional para la Grid (si la usas en otra parte) --- */
.aseguradoras-grid {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 20px;
  max-width: 900px;
  margin: 0 auto;
}

.aseguradoras-grid img {
  width: 150px; /* Ajustado de 1000px a algo real para una grid */
  height: auto;
  object-fit: contain;
  background-color: #ffffff;
  padding: 8px;
  border-radius: 8px;
}

<!-- Sección de Aseguradoras Termina-->


        /* --- PRODUCTOS --- */

.grid-container {

.card {

    text-align: center;
    text-decoration: none; /* Quita subrayado del link */

}

.card:hover { transform: translateY(-3px); }

/* Imagen para productos normales (fotos) */

}

/* --- ESTILO PARA HACER NIPPONFLEX MÁS PEQUEÑO --- */

.slider {

@keyframes scroll {

    <script>
        // Ocultar Splash Screen después de la animación
        setTimeout(() => {
            document.getElementById('splash').style.display = 'none';
        }, 1800);

        // Cambio de imagen de fondo cada 3 segundos
        const imagenes = [
            'https://images.unsplash.com/photo-1556761175-b413da4baf72?q=80&w=800',
            'FONDO PAGINA LOOM.png',
            'https://images.unsplash.com/photo-1521737604893-d14cc237f11d?q=80&w=800'
        ];
        
        let index = 0;
        const bg = document.getElementById('dynamic-bg');

        function rotateBackground() {
            index = (index + 1) % imagenes.length;
            // Aplicamos una superposición oscura para que el logo blanco resalte
            bg.style.backgroundImage = `linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.3)), url('${imagenes[index]}')`;
        }

        // Iniciar con la primera imagen y configurar el intervalo
        rotateBackground();
        setInterval(rotateBackground, 3000); // 3000ms = 3.0 segundos
    </script>
