<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cotizar</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #f5f7fa; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 450px; background-color: white; min-height: 100vh; padding-bottom: 90px; position: relative;}
        .header-blue { background: #0067b1; color: white; padding: 30px 20px; text-align: center; }
        .section-content { padding: 20px; }
        .back-btn { display: inline-block; margin-bottom: 20px; color: #0067b1; text-decoration: none; font-weight: bold; font-size: 14px; }
        
        /* Alerta de Éxito */
        .alert-success {
            display: none;
            background-color: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: 600;
            font-size: 14px;
            border: 1px solid #c3e6cb;
        }

        /* Estilos del Formulario */
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; color: #2c3e50; margin-bottom: 5px; }
        .form-group input, .form-group select, .form-group textarea { 
            width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; background: #fdfdfd;
        }
        .form-group textarea { resize: vertical; min-height: 80px; }
        .submit-btn { 
            width: 100%; padding: 15px; background-color: #0067b1; color: white; border: none; border-radius: 25px; 
            font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 10px; transition: background 0.2s;
        }
        .submit-btn:hover { background-color: #1c8bd4; }
        .submit-btn:disabled { background-color: #7ab2d6; cursor: not-allowed; }

        /* Contenedores dinámicos ocultos por defecto */
        .dynamic-fields { display: none; background: #f5f7fa; padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 1px dashed #0067b1; }

        /* Barra de navegación inferior */
        .bottom-nav { position: fixed; bottom: 0; width: 100%; max-width: 450px; height: 75px; background-color: #0067b1; display: flex; justify-content: space-around; align-items: center; color: white; z-index: 1000;}
        .nav-item { font-size: 10px; text-align: center; color: white; text-decoration: none; opacity: 0.8; }
        .nav-item i { font-size: 20px; margin-bottom: 3px; }
        .nav-item:hover { opacity: 1; }
        .center-circle { width: 60px; height: 60px; background: white; border: 4px solid #0067b1; border-radius: 50%; margin-top: -40px; display: flex; justify-content: center; align-items: center; color: #0067b1; font-size: 25px; }
    </style>
</head>
<body>
    <div class="container">
        <header class="header-blue">
            <h2>Cotiza con Nosotros</h2>
            <p style="font-size: 0.9rem; opacity: 0.9;">Llena el formulario para brindarte la mejor opción</p>
        </header>

        <main class="section-content">
            <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i> Volver al Perfil</a>

            <!-- Cuadro de mensaje exitoso (Oculto por defecto) -->
            <div id="alertaExito" class="alert-success">
                <i class="fas fa-check-circle"></i> ¡Mensaje enviado con éxito! En breve te contactaremos.
            </div>

            <!-- Formulario con ID para controlarlo desde JavaScript -->
            <form id="cotizacionForm">
                
                <input type="hidden" name="_captcha" value="false">

                <!-- FORMULARIO BASE -->
                <div class="form-group">
                    <label>Nombre completo *</label>
                    <input type="text" name="Nombre" placeholder="Tu nombre completo" required>
                </div>
                <div class="form-group">
                    <label>Email *</label>
                    <input type="email" name="Correo" placeholder="correo@ejemplo.com" required>
                </div>
                <div class="form-group">
                    <label>Teléfono *</label>
                    <input type="tel" name="Telefono" pattern="[0-9]{10}" placeholder="10 dígitos" required>
                </div>
                <div class="form-group">
                    <label>Código postal *</label>
                    <input type="text" name="Codigo_Postal" placeholder="Código Postal" required>
                </div>
                <div class="form-group">
                    <label>Edad</label>
                    <input type="number" name="Edad" placeholder="Ej. 35">
                </div>
                <div class="form-group">
                    <label>Género</label>
                    <input type="text" name="Genero" placeholder="Ej. Masculino">
                </div>

                <!-- TIPO DE SERVICIO (DESPLEGABLE) -->
                <div class="form-group">
                    <label>Tipo de servicio *</label>
                    <select id="tipoServicio" name="Servicio_Deseado" onchange="mostrarCamposDinamicos()" required>
                        <option value="">-- Selecciona una opción --</option>
                        <option value="auto">Seguro de auto, camión o tracto camión</option>
                        <option value="vida">Gastos Médicos, Seguro de vida</option>
                        <option value="vivienda">Seguro de vivienda</option>
                        <option value="empresarial">Empresarial</option>
                    </select>
                </div>

                <!-- CAMPOS DINÁMICOS: AUTO -->
                <div id="camposAuto" class="dynamic-fields">
                    <div class="form-group"><label>Marca</label><input type="text" name="Auto_Marca"></div>
                    <div class="form-group"><label>Modelo</label><input type="text" name="Auto_Modelo"></div>
                    <div class="form-group"><label>Versión</label><input type="text" name="Auto_Version"></div>
                    <div class="form-group">
                        <label>Tipo de tracto</label>
                        <select name="Auto_Tipo_Tracto"><option>SI</option><option>NO</option><option>NO APLICA</option></select>
                    </div>
                    <div class="form-group">
                        <label>¿Tiene adaptación?</label>
                        <select name="Auto_Adaptacion"><option>SI</option><option>NO</option><option>NO APLICA</option></select>
                    </div>
                    <div class="form-group">
                        <label>Tipo de carga</label>
                        <select name="Auto_Carga"><option>A</option><option>B</option><option>C</option><option>No aplica</option></select>
                    </div>
                </div>

                <!-- CAMPOS DINÁMICOS: VIDA / GASTOS MÉDICOS -->
                <div id="camposVida" class="dynamic-fields">
                    <div class="form-group">
                        <label>Fecha de nacimiento</label>
                        <input type="date" name="Vida_Fecha_Nacimiento">
                    </div>
                </div>

                <!-- CAMPOS DINÁMICOS: VIVIENDA -->
                <div id="camposVivienda" class="dynamic-fields">
                    <div class="form-group"><label>Ubicación</label><input type="text" name="Vivienda_Ubicacion"></div>
                    <div class="form-group"><label>Valor aproximado</label><input type="text" name="Vivienda_Valor" placeholder="$"></div>
                </div>

                <!-- CAMPOS DINÁMICOS: EMPRESARIAL -->
                <div id="camposEmpresarial" class="dynamic-fields">
                    <div class="form-group"><label>Giro de la empresa</label><input type="text" name="Empresa_Giro"></div>
                    <div class="form-group"><label>Niveles de construcción</label><input type="number" name="Empresa_Niveles"></div>
                    <div class="form-group"><label>Materiales de construcción</label><input type="text" name="Empresa_Materiales"></div>
                    <div class="form-group"><label>Contenidos</label><input type="text" name="Empresa_Contenidos"></div>
                    <div class="form-group"><label>Descripción de contenidos</label><textarea name="Empresa_Descripcion_Contenidos" placeholder="Describe los contenidos..."></textarea></div>
                </div>

                <!-- INFO ADICIONAL -->
                <div class="form-group">
                    <label>Información adicional</label>
                    <textarea name="Informacion_Adicional" placeholder="Cualquier detalle extra que debamos saber..."></textarea>
                </div>

                <button type="submit" id="btnEnviar" class="submit-btn">Solicitar Cotización</button>
            </form>
        </main>

        <nav class="bottom-nav">
            <a href="links.html" class="nav-item"><i class="fas fa-link"></i><br>Links</a>
            <a href="index.html" class="center-circle"><i class="fas fa-home"></i></a>
            <a href="productos.html" class="nav-item"><i class="fas fa-tag"></i><br>Servicios</a>
            <a href="cotizar.html" class="nav-item" style="opacity: 1;"><i class="fas fa-file-signature"></i><br>Cotizar</a>
        </nav>
    </div>

    <script>
        // Función para mostrar/ocultar campos dependiendo del tipo de seguro
        function mostrarCamposDinamicos() {
            const secciones = ['camposAuto', 'camposVida', 'camposVivienda', 'camposEmpresarial'];
            secciones.forEach(id => {
                const seccion = document.getElementById(id);
                seccion.style.display = 'none';
                const inputs = seccion.querySelectorAll('input, select, textarea');
                inputs.forEach(input => input.disabled = true);
            });
            
            const seleccion = document.getElementById('tipoServicio').value;
            let idMostrar = '';
            if (seleccion === 'auto') idMostrar = 'camposAuto';
            else if (seleccion === 'vida') idMostrar = 'camposVida';
            else if (seleccion === 'vivienda') idMostrar = 'camposVivienda';
            else if (seleccion === 'empresarial') idMostrar = 'camposEmpresarial';

            if (idMostrar) {
                const seccionMostrar = document.getElementById(idMostrar);
                seccionMostrar.style.display = 'block';
                const inputsHabilitar = seccionMostrar.querySelectorAll('input, select, textarea');
                inputsHabilitar.forEach(input => input.disabled = false);
            }
        }

        // Función para enviar el formulario sin recargar la página
        document.getElementById('cotizacionForm').addEventListener('submit', function(e) {
            e.preventDefault(); // Detiene la redirección automática

            const form = e.target;
            const btnEnviar = document.getElementById('btnEnviar');
            const alertaExito = document.getElementById('alertaExito');
            const formData = new FormData(form);

            // Cambiar estado del botón mientras se envía
            btnEnviar.textContent = 'Enviando...';
            btnEnviar.disabled = true;

            // Enviar datos usando Fetch a la API de FormSubmit
            fetch('https://formsubmit.co/ajax/lauranavarro14@hotmail.com', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                // Mostrar alerta verde
                alertaExito.style.display = 'block';
                
                // Limpiar el formulario y resetear campos dinámicos
                form.reset();
                mostrarCamposDinamicos();
                
                // Restaurar el botón original
                btnEnviar.textContent = 'Solicitar Cotización';
                btnEnviar.disabled = false;

                // Ocultar el mensaje de éxito después de 6 segundos
                setTimeout(() => {
                    alertaExito.style.display = 'none';
                }, 6000);
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Hubo un error al enviar tu cotización. Por favor, intenta nuevamente.');
                btnEnviar.textContent = 'Solicitar Cotización';
                btnEnviar.disabled = false;
            });
        });
    </script>
</body>
</html>
