<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productos</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* Reutilizamos el CSS anterior para mantener la estética */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #f5f7fa; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 450px; background-color: white; min-height: 100vh; padding-bottom: 90px; }
        .header-title { background: #0067b1; color: white; padding: 40px 20px; text-align: center; }
        .section-content { padding: 20px; }
        .grid-container { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
        .card { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 3px 10px rgba(0,0,0,0.08); text-align: center; }
        .card img { width: 100%; height: 110px; object-fit: cover; }
        .card p { padding: 10px; font-size: 13px; font-weight: 600; }
        .back-btn { display: inline-block; margin-bottom: 15px; color: #0067b1; text-decoration: none; font-weight: bold; }
        
        /* Barra de navegación (igual a la principal) */
        .bottom-nav { position: fixed; bottom: 0; width: 100%; max-width: 450px; height: 75px; background-color: #0067b1; display: flex; justify-content: space-around; align-items: center; color: white; }
        .nav-item { font-size: 10px; text-align: center; cursor: pointer; color: white; text-decoration: none; }
        .nav-item i { font-size: 20px; margin-bottom: 3px; }
        .center-circle { width: 60px; height: 60px; background: white; border: 4px solid #0067b1; border-radius: 50%; margin-top: -40px; display: flex; justify-content: center; align-items: center; color: #0067b1; font-size: 25px; }
    </style>
</head>
<body>
    <div class="container">
        <header class="header-title">
            <h1>Servicios</h1>
        </header>

        <main class="section-content">
            <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i> Volver al Perfil</a>
            <div class="grid-container">
                <div class="card"><img src="gastos medicos.jpg"><p>Gastos Médicos</p></div>
<div class="card"><img src="Seguro_de_Vida.png"><p>Seguro de Vida</p></div>
<div class="card"><img src="seguro de auto.jpg"><p>Seguro de Auto</p></div>
<div class="card"><img src="Seguro_de_Vivienda.png"><p>Seguro de Vivienda</p></div>
<div class="card"><img src="Transportacion_de_mercancia.png"><p>Transportación de Mercancía</p></div>
<div class="card"><img src="Transportacion_de_mercancia.png"><p>Tractocamión</p></div>
<div class="card"><img src="Empresarial.png"><p>Empresarial</p></div>
            </div>
            <div class="card"><p>Contrata ya!!</p></div>
        </main>

        <nav class="bottom-nav">
            <a href="links.html" class="nav-item"><i class="fas fa-link"></i><br>Links</a>
            <a href="index.html" class="center-circle"><i class="fas fa-home""></i></a>
            <a href="galeriahtml" class="nav-item"><i class="far fa-images"></i><br>Galería</a>
    </div>
</body>
</html>
